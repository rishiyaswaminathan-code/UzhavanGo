<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#174d35"/>
  <title>Admin – UZHAVANGO</title>
  <link rel="icon" type="image/png" href="assets/uzhavan-go-logo.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="admin.css"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

<!-- ===== LOGIN SCREEN ===== -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo">
      <img src="assets/uzhavan-go-logo.png" alt="UzhavanGo Logo" class="login-mark-img"/>
      <div class="login-title">UZHAVANGO<small>Admin Portal</small></div>
    </div>
    <h2>Admin Sign In</h2>
    <p>Secure access for platform administrators only.</p>
    <div class="login-error" id="loginError">Invalid credentials. Please try again.</div>
    <form onsubmit="adminLogin(event)">
      <div class="login-field">
        <label>Admin Username / Email</label>
        <input type="text" id="adminEmail" required placeholder="Enter admin username" autocomplete="username"/>
      </div>
      <div class="login-field">
        <label>Password</label>
        <input type="password" id="adminPass" required placeholder="••••••••" autocomplete="current-password"/>
      </div>
      <button type="submit" class="login-btn">Sign In to Dashboard →</button>
    </form>
    <div class="login-badge">🔐 Role-protected access · Farmers &amp; buyers cannot enter this portal</div>
  </div>
</div>

<!-- ===== ADMIN SHELL ===== -->
<div id="adminShell" style="display:none">

  <!-- Sidebar -->
  <aside class="admin-sidebar" id="sidebar">
    <div class="sidebar-brand">
      <img src="assets/uzhavan-go-logo.png" alt="UzhavanGo Logo" class="sidebar-mark-img"/>
      <div class="sidebar-name">UZHAVANGO<small>Admin Panel</small></div>
    </div>
    <nav class="sidebar-nav">
      <div class="sidebar-section">Main</div>
      <button class="nav-btn active" onclick="nav('dashboard')" id="nav-dashboard"><span class="nav-icon">🏠</span><span>Dashboard</span></button>
      <div class="sidebar-section">Users</div>
      <button class="nav-btn" onclick="nav('farmers')" id="nav-farmers"><span class="nav-icon">👨‍🌾</span><span>Farmers</span></button>
      <button class="nav-btn" onclick="nav('buyers')" id="nav-buyers"><span class="nav-icon">🧑‍💼</span><span>Buyers</span></button>
      <div class="sidebar-section">Marketplace</div>
      <button class="nav-btn" onclick="nav('products')" id="nav-products"><span class="nav-icon">🌾</span><span>Products</span></button>
      <button class="nav-btn" onclick="nav('offers')" id="nav-offers"><span class="nav-icon">💰</span><span>Offers</span></button>
      <button class="nav-btn" onclick="nav('orders')" id="nav-orders"><span class="nav-icon">📦</span><span>Orders</span></button>
      <button class="nav-btn" onclick="nav('deliveries')" id="nav-deliveries"><span class="nav-icon">🚚</span><span>Deliveries</span></button>
      <div class="sidebar-section">Moderation</div>
      <button class="nav-btn" onclick="nav('reports')" id="nav-reports"><span class="nav-icon">🚨</span><span>Reports</span></button>
      <button class="nav-btn" onclick="nav('reviews')" id="nav-reviews"><span class="nav-icon">⭐</span><span>Reviews</span></button>
      <button class="nav-btn" onclick="nav('notifications')" id="nav-notifications"><span class="nav-icon">🔔</span><span>Notifications</span></button>
      <div class="sidebar-section">Insights</div>
      <button class="nav-btn" onclick="nav('analytics')" id="nav-analytics"><span class="nav-icon">📊</span><span>Analytics</span></button>
      <button class="nav-btn" onclick="nav('activitylog')" id="nav-activitylog"><span class="nav-icon">📋</span><span>Activity Log</span></button>
      <button class="nav-btn" onclick="nav('settings')" id="nav-settings"><span class="nav-icon">⚙️</span><span>Settings</span></button>
    </nav>
    <div class="sidebar-footer">
      <button class="logout-btn" onclick="adminLogout()"><span class="nav-icon">🚪</span><span>Logout</span></button>
    </div>
  </aside>

  <!-- Main Content -->
  <div class="admin-content">
    <header class="admin-topbar">
      <div class="topbar-title" id="topbarTitle">Dashboard</div>
      <div class="topbar-right">
        <span class="topbar-time" id="topbarTime"></span>
        <div class="admin-avatar" title="Platform Admin">PA</div>
      </div>
    </header>
    <div class="admin-body" id="adminApp"></div>
  </div>

</div>

<!-- Modal Root -->
<div id="adminModalRoot"></div>
<!-- Toast -->
<div id="adminToast"></div>

<script src="admin.js"></script>
</body>
</html>
