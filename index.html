<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f6b45" />
    <title>UZHAVANGO — Direct farm marketplace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="admin.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <button class="brand" onclick="go('home')" aria-label="UZHAVANGO home"><span class="brand-mark">U</span><span>UZHAVANGO<small>Directly from the soil</small></span></button>
        <nav class="desktop-nav">
          <button onclick="go('market')">Marketplace</button>
          <button onclick="go('how')">How it works</button>
          <button onclick="go('orders')">Orders</button>
          <button id="navAdminBtn" onclick="go('admin')" style="color:var(--deep);font-weight:600">Admin</button>
        </nav>
        <div class="top-actions">
          <button class="location" onclick="locate()">◎ <span id="locationName">Madurai, Tamil Nadu</span></button>
          <button class="icon-btn" onclick="go('notifications')" title="Notifications">♧<i id="noticeDot"></i></button>
          <button class="avatar" onclick="go('profile')" id="userAvatarBtn" title="Profile & Roles">AR</button>
        </div>
      </header>
      <main id="app"></main>
      <nav class="mobile-nav">
        <button onclick="go('home')">⌂<span>Home</span></button>
        <button onclick="go('market')">⌕<span>Market</span></button>
        <button class="post-fab" onclick="go('post')">＋</button>
        <button onclick="go('orders')">▣<span>Orders</span></button>
        <button onclick="go('profile')">◉<span>Profile</span></button>
      </nav>
    </div>
    <div id="modalRoot"></div>
    <div id="toast"></div>
    <script src="app.js"></script>
  </body>
</html>
